name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: 10.6.0.190:80
  PROJECT: bohdan-devsecops
  IMAGE_NAME: nginx-gitops-demo

jobs:
  build-scan-push:
    runs-on: self-hosted

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Définir le tag de l'image
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Connexion à Harbor
        run: |
          echo "Harbor12345" | docker login ${{ env.REGISTRY }} -u admin --password-stdin

      - name: Construire l'image Docker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push image vers Harbor
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest
